name: Public README policy

on:
  push:
    branches: [main]
    paths:
      - README.md
      - packages/*/README.md
      - scripts/validate-public-readmes.mjs
      - .github/CODEOWNERS
      - .github/workflows/public-readme-policy.yml
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate public README files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0

      - run: test "$(node --version)" = "v$(tr -d '\n' < .nvmrc)"
      - run: node scripts/validate-public-readmes.mjs
