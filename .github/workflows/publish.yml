name: Publish invompt-mcp

on:
  push:
    tags:
      - v0.10.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_verify:
    name: Build, test, verify, and pack
    if: github.ref == 'refs/tags/v0.10.1'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.0
          registry-url: https://registry.npmjs.org

      - run: npm install --global npm@11.11.0
      - run: test "$(node --version)" = "v22.22.0" && test "$(npm --version)" = "11.11.0"
      - run: test "${GITHUB_REF_NAME}" = "v0.10.1" && test "$(git describe --tags --exact-match)" = "v0.10.1"
      - run: test "$(node -p 'require("./packages/invompt-mcp/package.json").version')" = "0.10.1"
      - run: npm ci
      - run: npm run check

      - name: Reject an already-published exact version
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/invompt-mcp/package.json').version")
          if npm view "invompt-mcp@${PACKAGE_VERSION}" version --json > registry-result.json 2>&1; then
            echo "invompt-mcp@${PACKAGE_VERSION} already exists in npm."
            exit 1
          fi
          if ! grep -Eq 'E404|404 Not Found' registry-result.json; then
            echo "Could not prove invompt-mcp@${PACKAGE_VERSION} is absent from npm."
            cat registry-result.json
            exit 1
          fi

      - name: Pack the verified publish artifact once
        run: |
          mkdir -p release-artifacts
          npm pack --workspace=invompt-mcp --pack-destination release-artifacts --ignore-scripts --json > release-artifacts/pack.json
          PACKAGE_VERSION=$(node -p "require('./packages/invompt-mcp/package.json').version")
          TARBALL="release-artifacts/invompt-mcp-${PACKAGE_VERSION}.tgz"
          test -f "$TARBALL"
          test "$(find release-artifacts -maxdepth 1 -name '*.tgz' -type f | wc -l | tr -d ' ')" = "1"
          sha256sum "$TARBALL" > release-artifacts/SHA256SUMS
          sha512sum "$TARBALL" > release-artifacts/SHA512SUMS
          node -e "const fs=require('node:fs'); const p=require('./packages/invompt-mcp/package.json'); const pack=JSON.parse(fs.readFileSync('release-artifacts/pack.json','utf8')); if (!Array.isArray(pack)||pack.length!==1||pack[0].name!=='invompt-mcp'||pack[0].version!==p.version) process.exit(1); fs.writeFileSync('release-artifacts/release-metadata.json', JSON.stringify({name:p.name,version:p.version,filename:pack[0].filename,integrity:pack[0].integrity},null,2)+'\\n')"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: invompt-mcp-0.10.1
          path: release-artifacts
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified npm artifact
    needs: build_and_verify
    if: github.ref == 'refs/tags/v0.10.1'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.0
          registry-url: https://registry.npmjs.org

      - run: npm install --global npm@11.11.0
      - run: test "$(node --version)" = "v22.22.0" && test "$(npm --version)" = "11.11.0"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: invompt-mcp-0.10.1
          path: release-artifacts

      - name: Verify isolated artifact identity and digests
        run: |
          node -e "const fs=require('node:fs'); const crypto=require('node:crypto'); const m=JSON.parse(fs.readFileSync('release-artifacts/release-metadata.json','utf8')); const integrity='sha512-'+crypto.createHash('sha512').update(fs.readFileSync('release-artifacts/invompt-mcp-0.10.1.tgz')).digest('base64'); if (m.name!=='invompt-mcp'||m.version!=='0.10.1'||m.filename!=='invompt-mcp-0.10.1.tgz'||m.integrity!==integrity) process.exit(1)"
          test "$(find release-artifacts -maxdepth 1 -name '*.tgz' -type f | wc -l | tr -d ' ')" = "1"
          sha256sum --check release-artifacts/SHA256SUMS
          sha512sum --check release-artifacts/SHA512SUMS

      - name: Publish trusted artifact
        run: npm publish ./release-artifacts/invompt-mcp-0.10.1.tgz --access public --tag next --ignore-scripts
